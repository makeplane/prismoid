# The JS half of the repo (ADR-071): the web app plus shared packages (packages/blocks, ADR-074).
# backend/ (uv) and sandbar/ (Go) are not packages; they keep their own toolchains, driven by
# the justfile.
packages:
  - web
  - packages/*

# Every version lives here; a package.json names a dependency as `catalog:` and nothing else.
catalog:
  "@base-ui/react": 1.9.0
  "@makeplane/propel": 0.9.9
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/sortable": 10.0.0
  "@dnd-kit/utilities": 3.2.2
  "@fontsource-variable/inter": 5.3.0
  "@fontsource-variable/jetbrains-mono": 5.3.0
  "@novnc/novnc": 1.7.0
  "@playwright/test": 1.65.1
  "@react-router/dev": 8.5.2
  "@react-router/node": 8.5.2
  "@shadcn/react": 0.3.1
  "@tailwindcss/vite": 4.3.5
  "@testing-library/dom": 10.4.2
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.13
  "@types/node": 22.20.5
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitest/coverage-v8": 5.1.1
  class-variance-authority: 0.7.1
  happy-dom: 21.0.4
  clsx: 2.1.1
  isbot: 5.2.3
  json-schema-to-typescript: 16.0.0
  lucide-react: 1.76.0
  mermaid: 11.17.2
  next-themes: 0.4.6
  openapi-fetch: 0.17.0
  openapi-typescript: 7.13.0
  oxfmt: 0.79.0
  oxlint: 1.94.0
  puppeteer-core: 25.18.1
  react: 19.3.1
  react-dom: 19.3.1
  react-markdown: 10.1.0
  react-router: 8.5.2
  remark-gfm: 4.0.1
  shadcn: 4.23.0
  shiki: 4.6.0
  tailwind-merge: 3.7.1
  tailwindcss: 4.3.5
  turbo: 2.11.13
  typescript: 5.9.3
  vite: 8.3.8
  vitest: 5.1.1
  zod: 4.6.7

catalogMode: prefer

cleanupUnusedCatalogs: true

# Security floors for transitive dependencies whose parents lag the fix (moved from
# web/package.json's pnpm.overrides, ADR-071). Bounded to the major the parent declares; raise
# the floor when a new advisory lands, never widen past the major.
overrides:
  "js-yaml@>=4.0.0 <4.3.2": ^4.3.2
  "@hono/node-server@<2.0.5": ">=2.0.5"
  "postcss@<=8.5.22": ">=8.5.23"
  "undici@>=7.0.0 <7.29.0": ">=7.29.0"
  "hono@<4.13.5": ^4.13.5
  # minimatch 5 declares ^2: the floor stays on the 2.x line (it was unbounded, which pulled 5.x in).
  "brace-expansion@>=2.0.0 <2.1.4": ">=2.1.4 <3"
  # openapi-typescript > @redocly/openapi-core > minimatch: GHSA fixed in 5.0.10/5.0.11/5.0.12.
  "brace-expansion@>=4.0.0 <5.0.12": ">=5.0.12 <6"
  # mermaid declares ^3.3.3; 3.4.17 fixes the critical SAFE_FOR_TEMPLATES bypass and its siblings.
  dompurify: ">=3.4.17 <4"
  # shadcn > @dotenvx/dotenvx > conf > ajv: four LOW/MEDIUM advisories fixed in 3.1.9.
  "fast-uri@>=3.0.0 <3.1.9": ">=3.1.9 <4"
  # shadcn > @shadcn/registry > socks: the Address6 quadratic-time advisories, fixed in 10.7.4.
  "ip-address@<10.7.4": ">=10.7.4 <11"
  # mermaid 11 declares ^0.16; the advisory is fixed only in 0.18.2+ (Plane carries the same pin).
  katex: ">=0.18.2 <0.19"
  # openapi-typescript > @redocly/openapi-core (pins 5.1.9) and shadcn > ts-morph > @ts-morph/common
  # (^10): the globparts amplification DoS is fixed only in 11.0.1, so this floor crosses both
  # majors on purpose. @ts-morph/common already calls the named export; redocly's one call site
  # is patched to it (patches/@redocly__openapi-core@1.34.17.patch).
  "minimatch@<11.0.1": ">=11.0.1 <12"
  # vite > postcss: fixed in 1.2.2.
  source-map-js: ">=1.2.2 <2"
  # shadcn > @dotenvx/dotenvx: fixed in 5.33.16.
  systeminformation: ">=5.33.16 <6"

# esbuild's install script fetches its native binary and MUST run, or a fresh clone, CI or a
# Docker `pnpm install` fails.
allowBuilds:
  esbuild: true

patchedDependencies:
  '@redocly/openapi-core@1.34.17': patches/@redocly__openapi-core@1.34.17.patch
