# Every commit passes the same gates CI runs. `uv run pre-commit install` once.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21   # match the ruff pinned in uv.lock (dev group ruff>=0.15) — hook and gate agree
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: layers
        name: import contracts (§7)
        entry: bash -c 'cd backend && uv run lint-imports --config .importlinter'
        language: system
        pass_filenames: false
        types: [python]

      - id: audit
        name: guardrail greps (§14)
        entry: bash -c 'cd backend && bash tools/audit.sh'
        language: system
        pass_filenames: false
