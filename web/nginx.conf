# The web SPA, served static. Two rules do all the work:
#   1. SPA fallback — any path that is not a real file serves index.html, so a hard refresh on
#      /tasks/abc keeps working (client-side routing takes over).
#   2. Immutable assets — the hashed /assets bundle is content-addressed by the build, so it is
#      safe to cache forever; index.html is never cached, so a deploy is picked up immediately.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
