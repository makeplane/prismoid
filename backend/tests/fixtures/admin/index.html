<!doctype html><meta charset="utf-8"><title>Admin · Sign in</title>
<h1>Admin</h1><p class="message">{{message}}</p>
<form method="post" action="/login">
  <label>Username <input name="user" aria-label="Username" autocomplete="username"></label>
  <label>Password <input type="password" name="password" aria-label="Password" autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
