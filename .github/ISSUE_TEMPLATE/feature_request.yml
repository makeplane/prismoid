name: Feature request
description: Propose a new capability or a change to how Prismoid behaves.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it could work, from the user's side first. Sketches and examples welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Tasks, planning or agents
        - Models and providers
        - Machines and sandboxes
        - Artifacts and documents
        - Connectors, search or web access
        - Skills, bots or routines
        - Web app
        - CLI
        - Deployment and operations
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this (see CONTRIBUTING.md; for a larger change, agree the design here first).
