# Release PRs, by hand only (ADR-082, amended 2026-11-17: a push to main starts nothing, so a
# release PR exists only when someone sets out to cut a release). Actions → Release → Run workflow
# with "tag" unchecked: release-please reads the conventional commits since the last release
# (squash-merged PR titles: it never looks inside a merge commit) and opens or updates ONE pull
# request that bumps the version files (version.txt, backend/pyproject.toml, backend/uv.lock,
# prismoid.__version__) and writes the CHANGELOG section. Run it again to refresh that PR after
# more commits land. Merging it is the release decision; this workflow never publishes anything.
#
# Tagging is a separate, deliberate run: Actions → Release → Run workflow with "tag" checked, after
# the release PR has merged. It creates the SemVer tag vX.Y.Z and a DRAFT GitHub release carrying
# the CHANGELOG section (release-please-config.json: draft + force-tag-creation); no package, image
# or asset is published, and the draft stays unpublished until a person publishes it. Images stay
# Branch Build's job, run by hand for that tag.
#
# A PR opened with the default GITHUB_TOKEN does not trigger CI. Set the RELEASE_PLEASE_TOKEN
# secret (a fine-grained token with contents + pull-requests write on this repository) to have CI
# run on release PRs; without it the workflow still works and CI runs when a person pushes to the PR.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag the merged release PR (vX.Y.Z) and write a draft GitHub release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Without "tag" a run only opens or updates the release PR; with it, it only tags.
          skip-github-release: ${{ !inputs.tag }}
          skip-github-pull-request: ${{ inputs.tag }}
