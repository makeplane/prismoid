# Nightly golden evals — the suite, against a real stack, with a run-over-run diff.
#
# This is a real workflow, not a placeholder. What it needs before it can run — the human inputs the
# build cannot supply for itself:
#   • secrets: ANTHROPIC_API_KEY (the producer), and a SECOND frontier key of a different family
#     (OPENAI_API_KEY here) so the cross-family judge is not the weak local qwen that rubber-stamps.
# Ollama is not in CI, so the frontier judge is added from that second key; without it the run still
# executes but the RubricJudge column is unverified.
#
# Trigger it by hand (Actions → Nightly golden evals → Run workflow) or let the schedule fire.

name: Nightly golden evals

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC nightly
  workflow_dispatch:
    inputs:
      limit:
        description: "How many golden cases to run"
        default: "100"

concurrency:
  group: evals
  cancel-in-progress: false   # a nightly must never cancel the run whose baseline the next one diffs

jobs:
  golden:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend   # the service dir (ADR-007)
        # bash -eo pipefail: without it `... | tee run.txt` takes tee's exit code, so the golden gate's
        # failure never failed the step and a failed run was promoted to the baseline.
        shell: bash
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PRISMOID_CLI_API_URL: http://localhost:8100
      # The browser rows (golden and the web suite) run only when an operator hosts the
      # fixture admin app somewhere a task's frame can reach, and then need computer use on.
      PRISMOID_EVALS_BROWSER_URL: ${{ vars.PRISMOID_EVALS_BROWSER_URL }}
      PRISMOID_COMPUTER_USE_ENABLED: ${{ vars.PRISMOID_EVALS_BROWSER_URL != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Bring up the stack (postgres + minio, the same compose as local)
        run: |
          docker compose -f deploy/compose.yaml up -d --wait
          docker compose -f deploy/compose.yaml run --rm minio-init

      - name: Install deps
        run: uv sync --frozen

      # uvx --from rust-just: the runner image ships no `just` binary; rust-just runs it without PATH ceremony.
      - name: Migrate + seed the catalog
        run: |
          uvx --from rust-just just migrate
          uv run prismoid models seed

      - name: Add a frontier judge of a second family (if the key is present)
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          uv run prismoid models add openai:gpt-5 --classes judge \
            --price input_token=1.25/M --price output_token=10/M --enable

      # The worker first: its first start creates the durable engine's database, which the API needs to boot.
      - name: Start the worker and API
        run: |
          .venv/bin/prismoid run worker > worker.log 2>&1 &  echo $! > worker.pid
          for _ in $(seq 1 90); do if grep -q "worker ready" worker.log; then break; fi; sleep 2; done
          grep -q "worker ready" worker.log || { cat worker.log; exit 1; }
          uv run prismoid run api --port 8100 > api.log 2>&1 &  echo $! > api.pid
          # wait for health before submitting work
          for _ in $(seq 1 60); do if curl -sf http://localhost:8100/healthz; then break; fi; sleep 2; done
          curl -sf http://localhost:8100/healthz || { cat api.log; exit 1; }

      # Signup is a call to the API, so it comes after the API is up.
      - name: Create a user + token (the eval harness reads ~/.prismoid/credentials)
        run: |
          uv run prismoid login --signup --email ci@example.com --name CI \
            --password "${{ secrets.CI_USER_PASSWORD || 'correct horse battery staple' }}"

      - name: The trivial50 talk set (a report, never a gate; the problem books' rows are dataset rows)
        continue-on-error: true
        run: uv run python -m evals.run --suite trivial50 | tee trivial50.txt

      - name: The selection lanes (advisory drift alarms — runners existed, cadence did not)
        continue-on-error: true
        run: |
          uv run python -m evals.run --suite bot-selection  | tee bot-selection.txt
          uv run python -m evals.run --suite skill-golden --limit 20 | tee skill-golden.txt
          uv run python -m evals.run --suite bot-golden   --limit 20 | tee bot-golden.txt

      - name: Run the golden suite
        run: |
          uv run python -m evals.run --suite golden \
            --limit "${{ github.event.inputs.limit || 100 }}" \
            --concurrency 6 --report report.json | tee run.txt

      # The web suite drives the fixture admin app, so it rides that variable. It runs after the
      # required golden step with its own timeout, so it can never starve the job's budget.
      - name: The web suite (ADVISORY; runs only with the fixture site)
        if: ${{ vars.PRISMOID_EVALS_BROWSER_URL != '' }}
        timeout-minutes: 45
        continue-on-error: true
        run: uv run python -m evals.suites.web | tee web.txt

      - name: Restore the previous run's baseline
        uses: actions/cache/restore@v6
        with:
          path: backend/baseline.json   # action paths resolve from the workspace root, not the step cwd
          # The save key appends `-${{ github.run_id }}`, so the exact key NEVER matches on the
          # next run — the diff silently no-op'd for every nightly. `restore-keys` prefix-matches
          # the newest prior save, which is the baseline this run is meant to diff against.
          key: evals-baseline-${{ github.ref_name }}
          restore-keys: |
            evals-baseline-${{ github.ref_name }}-

      - name: Run-over-run diff → job summary
        if: always()
        run: |
          {
            echo '## Golden evals'
            echo '```'
            tail -n 6 run.txt || true
            echo '```'
            echo '### Diff vs the previous nightly'
            echo '```'
            uv run python tools/evals_diff.py baseline.json report.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Promote this run to the baseline
        if: success()
        run: cp report.json baseline.json

      - name: Save the new baseline
        if: success()
        uses: actions/cache/save@v6
        with:
          path: backend/baseline.json
          key: evals-baseline-${{ github.ref_name }}-${{ github.run_id }}

      - name: Keep the report as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-report
          path: backend/report.json

      - name: Stop the stack
        if: always()
        run: |
          kill "$(cat worker.pid)" "$(cat api.pid)" 2>/dev/null || true
          docker compose -f deploy/compose.yaml down -v
